name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Static project validation
        run: python tools/validate_project.py

      - name: Restore
        run: dotnet restore HostDeviceControl.Poc.sln

      - name: Formatting verification
        run: dotnet format HostDeviceControl.Poc.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HostDeviceControl.Poc.sln --configuration Release --no-restore

      - name: Engineering protocol tests
        run: dotnet run --project tests/HostDeviceControl.Protocol.Tests/HostDeviceControl.Protocol.Tests.csproj --configuration Release --no-build
