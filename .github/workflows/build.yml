name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Static project validation
        run: python tools/validate_project.py

      - name: Restore
        run: dotnet restore HostDeviceControl.Poc.sln

      - name: Formatting verification
        run: dotnet format HostDeviceControl.Poc.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HostDeviceControl.Poc.sln --configuration Release --no-restore

      - name: Engineering tests
        id: engineering_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          $testProjects = @(
            @{ Name = "Protocol"; Project = "tests/HostDeviceControl.Protocol.Tests/HostDeviceControl.Protocol.Tests.csproj"; Output = "protocol-test-output.txt" },
            @{ Name = "Serial transport"; Project = "tests/HostDeviceControl.Transport.Serial.Tests/HostDeviceControl.Transport.Serial.Tests.csproj"; Output = "serial-transport-test-output.txt" }
          )

          foreach ($testProject in $testProjects) {
            $output = & dotnet run `
              --project $testProject.Project `
              --configuration Release `
              --no-build 2>&1
            $testExitCode = $LASTEXITCODE
            @($output) | ForEach-Object { "$_" } |
              Tee-Object -FilePath $testProject.Output

            "## $($testProject.Name) engineering tests" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $testProject.Output | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY

            if ($testExitCode -ne 0) {
              Write-Output "::error title=$($testProject.Name) engineering tests failed::See the job summary and engineering-test-evidence artifact."
              $failed = $true
            }
          }

          if ($failed) { exit 1 }

      - name: Upload engineering-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineering-test-evidence
          path: |
            protocol-test-output.txt
            serial-transport-test-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce engineering-test result
        if: steps.engineering_tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Engineering tests failed. See the job summary and engineering-test-evidence artifact."
          exit 1
