name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Static project validation
        run: python tools/validate_project.py

      - name: Restore
        run: dotnet restore HostDeviceControl.Poc.sln

      - name: Formatting verification
        run: dotnet format HostDeviceControl.Poc.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HostDeviceControl.Poc.sln --configuration Release --no-restore

      - name: Engineering protocol tests
        id: engineering_protocol_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $outputPath = "protocol-test-output.txt"
          $output = & dotnet run `
            --project tests/HostDeviceControl.Protocol.Tests/HostDeviceControl.Protocol.Tests.csproj `
            --configuration Release `
            --no-build 2>&1
          $testExitCode = $LASTEXITCODE
          @($output) | ForEach-Object { "$_" } |
            Tee-Object -FilePath $outputPath

          "## Engineering protocol tests" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content $outputPath | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

          exit $testExitCode

      - name: Upload protocol-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-test-evidence
          path: protocol-test-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce protocol-test result
        if: steps.engineering_protocol_tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Engineering protocol tests failed. See the job summary and protocol-test-evidence artifact."
          exit 1
